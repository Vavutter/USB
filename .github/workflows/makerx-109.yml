name: Build and launch-test Makerx 1.1.1

on:
  push:
    branches:
      - makerx-minimal-branding-1.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct source
        run: |
          set -euo pipefail
          cat makerx109/parts/part00.b64 makerx109/parts/part01.b64 makerx109/parts/part02.b64 makerx109/parts/part03a.b64 makerx109/parts/part03b.b64 makerx109/parts/part03c.b64 makerx109/parts/part03d.b64 makerx109/parts/part04a.b64 makerx109/parts/part04b.b64 makerx109/parts/part04c.b64 makerx109/parts/part04d.b64 > /tmp/project.b64
          base64 --decode /tmp/project.b64 > /tmp/project.zip
          mkdir -p makerx-project
          unzip -q /tmp/project.zip -d makerx-project
          python3 makerx111/patch.py
      - name: Build APK
        working-directory: makerx-project
        run: gradle --no-daemon assembleDebug
      - name: Verify and package
        run: |
          set -euo pipefail
          APK=makerx-project/app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.moritz.makerx111'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.moritz.vescfix03.MainActivity'" /tmp/badging.txt
          cp "$APK" Makerx-1.1.1.apk
          sha256sum Makerx-1.1.1.apk > Makerx-1.1.1.sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Makerx-1.1.1
          path: |
            Makerx-1.1.1.apk
            Makerx-1.1.1.sha256.txt
          if-no-files-found: error

  launch-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Makerx-1.1.1
          path: artifact
      - name: Launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            adb install artifact/Makerx-1.1.1.apk
            adb logcat -c
            adb shell am start -W -n com.moritz.makerx111/com.moritz.vescfix03.MainActivity
            sleep 5
            test -n "$(adb shell pidof com.moritz.makerx111 | tr -d '\r')"
            ! adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|Process: com\.moritz\.makerx111.*has died'
