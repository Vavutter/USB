name: Build and launch-test Makerx 1.0.9

on:
  push:
    branches:
      - makerx-1.0.9-clean
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct clean source project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            makerx109/parts/part00.b64 \
            makerx109/parts/part01.b64 \
            makerx109/parts/part02.b64 \
            makerx109/parts/part03a.b64 \
            makerx109/parts/part03b.b64 \
            makerx109/parts/part03c.b64 \
            makerx109/parts/part03d.b64 \
            makerx109/parts/part04a.b64 \
            makerx109/parts/part04b.b64 \
            makerx109/parts/part04c.b64 \
            makerx109/parts/part04d.b64 > /tmp/makerx-project.b64
          base64 --decode /tmp/makerx-project.b64 > /tmp/makerx-project.zip
          mkdir -p makerx-project
          unzip -q /tmp/makerx-project.zip -d makerx-project
          test -f makerx-project/app/src/main/java/com/moritz/vescfix03/MainActivity.java
          grep -q 'applicationId "com.moritz.makerx109"' makerx-project/app/build.gradle

      - name: Build signed debug APK from source
        working-directory: makerx-project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=makerx-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.moritz.makerx109'" /tmp/badging.txt
          grep -q "launchable-activity: name='com.moritz.vescfix03.MainActivity'" /tmp/badging.txt
          cp "$APK" Makerx-1.0.9-Clean-Build.apk
          sha256sum Makerx-1.0.9-Clean-Build.apk > Makerx-1.0.9-Clean-Build.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Makerx-1.0.9-Clean-Build
          path: |
            Makerx-1.0.9-Clean-Build.apk
            Makerx-1.0.9-Clean-Build.sha256.txt
          if-no-files-found: error
          retention-days: 30

  launch-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Makerx-1.0.9-Clean-Build
          path: artifact

      - name: Launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -e
            adb install -r artifact/Makerx-1.0.9-Clean-Build.apk
            adb logcat -c
            adb shell am start -W -n com.moritz.makerx109/com.moritz.vescfix03.MainActivity | tee /tmp/start.txt
            sleep 5
            PID=$(adb shell pidof com.moritz.makerx109 | tr -d '\r')
            test -n "$PID"
            if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|Process: com\.moritz\.makerx109.*has died'; then
              adb logcat -d
              exit 1
            fi
            adb exec-out screencap -p > Makerx-1.0.9-emulator.png

      - name: Upload launch-test screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Makerx-1.0.9-Launch-Test
          path: Makerx-1.0.9-emulator.png
          if-no-files-found: error
          retention-days: 30
